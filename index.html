<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day, Amma!</title>
    <style>
        body {
            background-color: #d32f2f; /* Deep Red Background */
            color: white;
            text-align: center;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }
        .card {
            background: white;
            color: #333;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #d32f2f; margin-bottom: 10px; }
        .message { font-size: 1.2rem; line-height: 1.6; }
        .heart-bg {
            font-size: 30px;
            position: fixed;
            top: -10%;
            z-index: -1;
            user-select: none;
            animation: fall 5s linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(110vh); }
        }
    </style>
</head>
<body>

    <div class="heart-bg" style="left:10%; animation-delay:0s;">❤️</div>
    <div class="heart-bg" style="left:30%; animation-delay:2s;">💖</div>
    <div class="heart-bg" style="left:70%; animation-delay:1s;">❤️</div>
    <div class="heart-bg" style="left:90%; animation-delay:3s;">💕</div>

    <div class="card">
        <h1>Happy Mother's Day!</h1>
        <h3>ప్రియమైన అమ్మకు,</h3>
        <p class="message">
            "అమ్మ అంటే ప్రేమ, అమ్మ అంటే రక్షణ. <br>
            నా జీవితంలో నువ్వు ఉండటం నా అదృష్టం."
        </p>
        <p>You are the strongest and most loving person I know. Thank you for always believing in me!</p>
        <div style="font-size: 40px;">💐🌹💐</div>
    </div>

</body>
</html>
