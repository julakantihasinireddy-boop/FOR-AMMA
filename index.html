<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day!</title>
    <style>
        body { background-color: #d32f2f; color: white; text-align: center; font-family: 'Arial', sans-serif; padding: 20px; }
        .card { background: white; color: #333; max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: none; }
        .btn { background: #d32f2f; color: white; border: none; padding: 15px 30px; font-size: 20px; border-radius: 50px; cursor: pointer; margin: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-hate { background: #ccc; cursor: not-allowed; }
        #initial-screen, #second-screen { margin-top: 100px; }
        #second-screen { display: none; }
        img, video { width: 100%; border-radius: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="initial-screen">
        <button class="btn" onclick="showSecond()">OPEN SURPRISE 🎁</button>
    </div>

    <div id="second-screen">
        <h1>I LOVE YOU MAA ❤️</h1>
        <button class="btn" onclick="showFinal()">SAY TO ME</button>
    </div>

    <div id="final-screen" class="card">
        <h2>I Love You Too! 😘</h2>
        <div style="margin-bottom: 20px;">
            <button class="btn" style="background: #4caf50;">I Love You Too</button>
            <button class="btn btn-hate" onclick="alert('You cant click this! 😜')">I Hate You</button>
        </div>
        
        <hr>
        <h3>ప్రియమైన అమ్మకు,</h3>
        <p>"అమ్మ అంటే ప్రేమ, అమ్మ అంటే రక్షణ."</p>

        <video controls>
          <source src="WhatsApp Video 2026-05-09 at 3.12.12 PM.mp4" type="video/mp4">
        </video>

        <img src="WhatsApp Image 2026-05-09 at 3.12.18 PM.jpeg">
        <img src="WhatsApp Image 2026-05-09 at 3.12.17 PM.jpeg">
        <img src="WhatsApp Image 2026-05-09 at 3.12.16 PM.jpeg">
        
        <p>You are the best Amma in the world! 💐</p>
    </div>

    <script>
        function showSecond() {
            document.getElementById('initial-screen').style.display = 'none';
            document.getElementById('second-screen').style.display = 'block';
        }
        function showFinal() {
            document.getElementById('second-screen').style.display = 'none';
            document.getElementById('final-screen').style.display = 'block';
        }
    </script>
</body>
</html>
